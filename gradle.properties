# Vedic Mitra — Gradle configuration
# Docs: https://docs.gradle.org/current/userguide/build_environment.html

# --- JVM / daemon ------------------------------------------------------------
# 4 GB heap + file encoding keeps large Android + Compose builds stable on CI and locally.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# --- Performance -------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# --- Kotlin ------------------------------------------------------------------
# "official" applies the Kotlin coding conventions (matches ktlint / Spotless expectations).
kotlin.code.style=official

# --- AndroidX ----------------------------------------------------------------
android.useAndroidX=true
# Jetifier is unnecessary — the project has no legacy support-library dependencies.
android.enableJetifier=false
# Each module generates its own R class; avoids leaking resources across modules.
android.nonTransitiveRClass=true

# --- Reproducibility ---------------------------------------------------------
# Disable build features globally that no module needs yet (opt in per-module when required).
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false

# Silence the "compileSdk is newer than this AGP was tested with" warning; compileSdk 36 is
# intentional. Remove once the AGP version officially lists 36 as tested.
android.suppressUnsupportedCompileSdk=36
