# App version — the single source of truth for the installable build.
#
# Bump these for every release you distribute:
#   * VERSION_CODE  — an integer that MUST strictly increase each release. Android uses it to
#                     decide whether an installed app can be updated; a build whose code is <=
#                     the installed one is rejected as a downgrade. Never reuse a value.
#   * VERSION_NAME  — the human-facing version shown to users (semantic versioning recommended).
#
# These are read by the :app convention plugin (AndroidApplicationConventionPlugin). This file is
# committed on purpose — version numbers are not secrets.
VERSION_CODE=1
VERSION_NAME=0.1.0
