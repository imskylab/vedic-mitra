name: CI

# Runs the full quality gate on every push to main, on every pull request, and on demand
# (workflow_dispatch) so any branch can be checked without opening a PR.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      # Guarantees the Android SDK, platform 36, build-tools, and accepted licenses are present,
      # independent of what the runner image happens to ship with.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only write to the dependency cache from the default branch.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Ensures ./gradlew is executable even if the bit wasn't stored (e.g. committed from Windows).
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Spotless (formatting check)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Detekt (static analysis)
        run: ./gradlew detekt --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          # A throwaway convenience build — released APKs live in GitHub Releases, so expire this fast.
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          # Only needed to debug a failed run; no reason to keep them around.
          retention-days: 7
