name: CI

# Runs the full quality gate on every push to main and on every pull request.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Guarantees the Android SDK, platform 36, build-tools, and accepted licenses are present,
      # independent of what the runner image happens to ship with.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to the dependency cache from the default branch.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Ensures ./gradlew is executable even if the bit wasn't stored (e.g. committed from Windows).
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # TEMP DIAGNOSTIC: run each gate, capture output, and publish the tail to the job summary
      # (rendered in the run page HTML, readable without admin/log access). Reverted once green.
      - name: Verify (spotless, detekt, tests, assemble)
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          run_step () {
            echo "::group::$1"
            echo "===== $1 =====" >> build-output.txt
            ./gradlew $2 --stacktrace >> build-output.txt 2>&1
            local rc=$?
            echo "exit=$rc for $1" >> build-output.txt
            echo "::endgroup::"
            return $rc
          }
          rc=0
          run_step "spotlessCheck" "spotlessCheck" || { echo "FAILED_STEP=spotlessCheck" >> build-output.txt; rc=1; }
          if [ $rc -eq 0 ]; then run_step "detekt" "detekt" || { echo "FAILED_STEP=detekt" >> build-output.txt; rc=1; }; fi
          if [ $rc -eq 0 ]; then run_step "testDebugUnitTest" "testDebugUnitTest" || { echo "FAILED_STEP=testDebugUnitTest" >> build-output.txt; rc=1; }; fi
          if [ $rc -eq 0 ]; then run_step "assembleDebug" "assembleDebug" || { echo "FAILED_STEP=assembleDebug" >> build-output.txt; rc=1; }; fi
          exit $rc

      - name: Publish output to job summary
        if: always()
        run: |
          {
            echo "## Gradle verify output (tail)"
            grep -E "^FAILED_STEP=" build-output.txt || echo "FAILED_STEP=none"
            echo '```'
            tail -n 150 build-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if verify failed
        if: steps.verify.outcome == 'failure'
        run: exit 1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
