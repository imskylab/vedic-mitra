version: 2
updates:
  # Keep Gradle dependencies (version catalog + build scripts) up to date.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Kotlin + KSP + the Compose compiler must move together and in lockstep with the Compose
      # BOM, so group them into a single PR rather than several uncoordinated ones.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      # Roll routine test/quality tooling bumps into one PR.
      dev-tools:
        patterns:
          - "io.mockk*"
          - "app.cash.turbine*"
          - "com.google.truth*"
          - "io.gitlab.arturbosch.detekt*"
    ignore:
      # Major upgrades of the build toolchain are coordinated, breaking changes (as the AGP 8 -> 9
      # lift was); do them deliberately on a branch. Minor/patch within the current major flow.
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      # The Gradle wrapper: allow minor/patch, never a major (8.x -> 9.x) auto-bump.
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      # Kotlin + KSP: allow minor and patch (Dependabot groups them so they move together, and CI
      # verifies the result); hold only the next major, a coordinated language upgrade.
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major"]
      # androidx/Compose: the current line requires compiling against compileSdk 37, which is only a
      # preview (android-CANARY). Hold minor/major until API 37 ships as a stable platform.
      # (Dagger-Hilt is no longer held — the AGP 9 migration unblocked it.)
      - dependency-name: "androidx.*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Major bumps of the formatting engine change output; upgrade deliberately, not automatically.
      - dependency-name: "com.diffplug.spotless"
        update-types: ["version-update:semver-major"]
      # kotlinx-datetime 0.7+ is tied to the newer androidx/API-37 line; bump alongside that upgrade.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-datetime"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions pinned versions current (grouped into one PR).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
