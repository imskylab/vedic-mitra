# Vedic Mitra — Gradle Version Catalog
#
# Single source of truth for every dependency and plugin version used across the build.
# Reference these aliases from module build scripts (e.g. `implementation(libs.androidx.core.ktx)`)
# and never hard-code a version in a module. Bumping a version here updates every module at once.
#
# Sections:
#   [versions]  — the version numbers, referenced by libraries/plugins below
#   [libraries] — dependency coordinates (group:artifact) bound to a version
#   [bundles]   — named groups of libraries applied together
#   [plugins]   — Gradle plugin ids bound to a version

[versions]

# --- Build tooling -----------------------------------------------------------
# AGP 8.9.x aligns with compileSdk 36 (Android 16) and requires Gradle 8.11+ (we use 8.14).
agp = "8.9.1"
kotlin = "2.4.10"
ksp = "2.3.10"

# --- AndroidX / Jetpack ------------------------------------------------------
androidxCore = "1.15.0"
androidxActivity = "1.9.3"
androidxLifecycle = "2.8.7"
androidxNavigation = "2.8.5"
androidxDatastore = "1.1.1"

# --- Compose -----------------------------------------------------------------
# The BOM aligns all Compose artifact versions; keep individual Compose libs unversioned.
composeBom = "2024.12.01"

# --- Dependency Injection ----------------------------------------------------
hilt = "2.54"
hiltNavigationCompose = "1.2.0"

# --- Asynchronous ------------------------------------------------------------
coroutines = "1.11.0"

# --- Serialization -----------------------------------------------------------
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"

# --- Testing -----------------------------------------------------------------
junit = "4.13.2"
androidxTestExt = "1.2.1"
androidxTestEspresso = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
truth = "1.4.4"

# --- Static analysis / formatting -------------------------------------------
detekt = "1.23.7"
spotless = "7.0.2"
ktlint = "1.5.0"

[libraries]

# --- AndroidX / Jetpack ------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# --- Compose (versions come from the BOM) -----------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Dependency Injection ----------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Asynchronous ------------------------------------------------------------
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Serialization / time ----------------------------------------------------
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }

# --- Testing -----------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

# --- Gradle plugins referenced from convention plugins (build-logic) ---------
# Exposed as libraries so build-logic can put them on its compile classpath and then apply the
# plugins by id. Keep in sync with the [plugins] section below.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# --- Detekt rule packs -------------------------------------------------------
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[bundles]

# Core Compose surface every UI module needs.
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

# Lifecycle helpers commonly used by Compose screens + ViewModels.
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]

# Coroutines runtime.
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]

# Unit-test essentials shared by every module's test source set.
unit-test = [
    "junit",
    "kotlinx-coroutines-test",
    "mockk",
    "turbine",
    "truth",
]

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# --- Convention plugins (defined in build-logic) -----------------------------
# These ids are produced by the included build; modules apply them instead of repeating config.
vedicmitra-android-application = { id = "vedicmitra.android.application" }
vedicmitra-android-library = { id = "vedicmitra.android.library" }
vedicmitra-android-compose = { id = "vedicmitra.android.compose" }
vedicmitra-android-hilt = { id = "vedicmitra.android.hilt" }
vedicmitra-android-feature = { id = "vedicmitra.android.feature" }
vedicmitra-kotlin-library = { id = "vedicmitra.kotlin.library" }
